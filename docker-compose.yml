services:
  cashguard:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-change-me}
      DATABASE_URL: postgresql://cashguard:${POSTGRES_PASSWORD:-cashguard}@db:5432/cashguard
      LEARNING_ENABLED: ${LEARNING_ENABLED:-true}
      AUTO_RETRAIN: ${AUTO_RETRAIN:-true}
      RETRAIN_MIN_REVIEWS: ${RETRAIN_MIN_REVIEWS:-3}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: cashguard
      POSTGRES_USER: cashguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashguard -d cashguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate --url http://cashguard:8000
    depends_on: [cashguard]
    restart: unless-stopped
    profiles: [public]

volumes:
  pgdata:
