# Зоны в нормализованных координатах кадра: x и y от 0 до 1,
# (0,0) — левый верхний угол. Полигон — минимум 3 точки.
#
#   cash_zone   — рабочее место кассира / кассовый узел
#   client_zone — место клиента у кассового окна
#
# Правило, которому нужна отсутствующая зона, пропускается
# (например, cashier_left_during_service без client_zone).
# Профиль выбирается полем `profile` в POST /api/v1/analyze,
# по умолчанию — ZONE_PROFILE (default). Точные зоны под конкретную
# камеру удобнее всего нарисовать в веб-интерфейсе.

profiles:
  # Камера смотрит на рабочее место кассира, весь кадр — кассовая зона.
  # Используется для запросов жюри без указания зон.
  default:
    cash_zone: [[0, 0], [1, 0], [1, 1], [0, 1]]

  # Боковая камера: кассир слева, окно и клиент справа.
  teller_side_left:
    cash_zone: [[0, 0], [0.55, 0], [0.55, 1], [0, 1]]
    client_zone: [[0.6, 0], [1, 0], [1, 1], [0.6, 1]]

  # Камера над кассиром за спиной: стол и кассир внизу, окно и клиент вверху.
  overhead_behind_cashier:
    cash_zone: [[0, 0.4], [1, 0.4], [1, 1], [0, 1]]
    client_zone: [[0, 0], [1, 0], [1, 0.35], [0, 0.35]]
