norms:
  rules_231:
    act: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот,
      монет и ценностей в банках второго уровня, филиалах банков-нерезидентов
      Республики Казахстан, Национальном операторе почты и юридических лицах,
      исключительной деятельностью которых является инкассация банкнот, монет и
      ценностей (утв. постановлением Правления Национального Банка Республики
      Казахстан от 29 ноября 2019 года № 231, рег. № 19680)
    short: "Правила кассовых операций (пост. Правления НБРК от 29.11.2019 № 231)"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
  rules_14:
    act: >-
      Правила организации охраны и устройства помещений банков второго уровня,
      филиалов банков-нерезидентов Республики Казахстан, Национального оператора
      почты, юридических лиц, исключительной деятельностью которых является
      инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих
      деятельность исключительно через обменные пункты (утв. постановлением
      Правления Национального Банка Республики Казахстан от 24 февраля 2020 года
      № 14, рег. № 20075)
    short: "Правила охраны и устройства помещений (пост. Правления НБРК от 24.02.2020 № 14)"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"

class_aliases:
  banknote: cash
  money: cash
  stack of banknotes: cash
  smartphone: cell phone
  mobile phone: cell phone

class_conf:
  cash: 0.08
  cell phone: 0.08
  laptop: 0.3
  tv: 0.3

zoom_classes: ["cell phone", "cash"]

fixture_classes: ["cell phone", "handbag", "backpack", "suitcase", "cash"]

rules:
  - type: cashier_uses_phone
    title: "Кассир пользуется мобильным телефоном"
    kind: held_by_staff
    classes: ["cell phone"]
    staff_zone: cash_zone
    box_expand: -0.05
    min_conf: 0.15
    min_duration_sec: 1
    requires_localized_zone: true
    severity: high
    observed: "у кассира в руках предмет, похожий на мобильный телефон ({duration} с)"
    why: >-
      Предмет в руках кассира, а не клиента. Похожим образом модель видит
      веер купюр, поэтому кадр нужно посмотреть. У смартфона есть
      функция фото- и видеофиксации, такие средства связи в кассовый узел
      вносить нельзя.
    norms:
      - ref: rules_231
        clause: "п. 12"
        quote: >-
          Хранение личных вещей, наличных денег и ценностей работников банка
          осуществляется вне кассового узла в порядке, установленном внутренними
          документами банка. Допускается внос работниками банка в кассовый узел
          лекарственных средств, медицинских изделий и средств связи, не имеющих
          функции фото и видео фиксации.

  - type: cash_left_unattended
    title: "Наличные оставлены без присмотра"
    kind: static_object
    classes: ["cash", "cell phone"]
    zone: desk_zone
    staff_zone: cash_zone
    require_staff_absent: true
    min_conf: 0.1
    settle_sec: 2
    min_duration_sec: 2
    requires_localized_zone: true
    severity: high
    observed: "кассира нет на месте, а на столе лежит небольшой предмет (пачка наличных или телефон) ({duration} с)"
    why: >-
      Кассир отошёл, а на столе остались лежать деньги или ценный предмет.
      Принятые наличные должны храниться в закрывающихся на ключ устройствах
      рабочего места.
    norms:
      - ref: rules_231
        clause: "п. 20"
        quote: >-
          На рабочем месте кассового работника находятся наличные деньги
          клиента. Все ранее принятые наличные деньги хранятся в специальных
          устройствах, находящихся на рабочем месте кассового работника,
          закрывающихся на ключ, предназначенных для хранения наличных денег
          (металлический шкаф, сейф, тележка, ящики стола, тумба).

  - type: second_visitor_during_service
    title: "Посторонний у кассы во время обслуживания"
    kind: visitor_count_exceeds
    staff_zone: cash_zone
    max_count: 1
    min_conf: 0.6
    near_desk: true
    min_duration_sec: 2.5
    requires_localized_zone: true
    severity: high
    observed: "у кассы одновременно находятся {count} посетителя, кроме кассира"
    why: >-
      Операция ведётся с одним клиентом и его наличными. Второй человек у
      стола во время обслуживания может передавать или получать деньги в
      обход процедуры. Кто это, по видео не определить (лица не
      распознаются), это решает проверяющий.
    norms:
      - ref: rules_231
        clause: "п. 20"
        quote: >-
          Наличные деньги принимаются и пересчитываются кассовым работником в
          присутствии клиента. На рабочем месте кассового работника находятся
          наличные деньги клиента.

  - type: workplace_left_open
    enabled: false
    title: "Рабочее место оставлено открытым"
    kind: zone_unattended
    watch_classes: ["laptop", "tv"]
    watch_zone: desk_zone
    staff_zone: cash_zone
    min_conf: 0.7
    staff_min_conf: 0.35
    min_duration_sec: 2
    requires_localized_zone: true
    severity: high
    observed: "кассира нет на рабочем месте, а экран компьютера остаётся включённым ({duration} с)"
    why: >-
      Уходя, кассир не закрыл рабочее место: компьютер не выключен и не
      заблокирован. Проверяющему стоит посмотреть, заперты ли сейф и ящики
      с наличными.
    norms:
      - ref: rules_231
        clause: "п. 20"
        quote: >-
          Все ранее принятые наличные деньги хранятся в специальных устройствах,
          находящихся на рабочем месте кассового работника, закрывающихся на
          ключ, предназначенных для хранения наличных денег (металлический шкаф,
          сейф, тележка, ящики стола, тумба).

  - type: cashier_left_during_service
    title: "Кассир покинул рабочее место при клиенте"
    kind: zone_unattended
    watch_classes: ["person"]
    watch_zone: client_zone
    watch_outside_staff: true
    require_prior_client: true
    staff_zone: cash_zone
    min_conf: 0.5
    min_duration_sec: 6
    requires_localized_zone: true
    severity: high
    observed: "у кассы находится посетитель, а на рабочем месте кассира никого нет ({duration} с)"
    why: >-
      Кассовому работнику не допускается покидать рабочее место до окончания
      обслуживания клиента.
    norms:
      - ref: rules_231
        clause: "п. 22"
        quote: >-
          Кассовому работнику не допускается покидать рабочее место до окончания
          обслуживания клиента.

  - type: unauthorized_person_in_cash_zone
    title: "Постороннее лицо на рабочем месте кассира"
    kind: person_count_exceeds
    zone: cash_zone
    max_count: 1
    min_conf: 0.45
    min_duration_sec: 3
    requires_localized_zone: true
    severity: high
    observed: "в зоне рабочего места кассира одновременно находятся {count} человека"
    why: >-
      Кассовый узел изолирован и доступен через один закрывающийся служебный
      вход, второй человек на месте кассира может означать допуск
      постороннего. Личность не определяется, проверяющему нужно убедиться,
      что это не уполномоченный работник.
    norms:
      - ref: rules_14
        clause: "п. 8"
        quote: >-
          Кассовый узел подлежит изолированию от других производственных,
          подсобных, подвальных и служебных помещений одним закрывающимся
          служебным входом.

  - type: personal_items_in_cash_zone
    title: "Личные вещи на рабочем месте кассира"
    kind: object_in_zone
    classes: ["handbag", "backpack", "suitcase"]
    zone: cash_zone
    min_conf: 0.4
    min_duration_sec: 8
    severity: medium
    observed: "на рабочем месте кассира находится сумка, рюкзак или чемодан"
    why: >-
      Личные вещи работников хранятся вне кассового узла. Проверяющему нужно
      убедиться, что это не инкассаторская сумка, переданная по процедуре.
    norms:
      - ref: rules_231
        clause: "п. 12"
        quote: >-
          Хранение личных вещей, наличных денег и ценностей работников банка
          осуществляется вне кассового узла в порядке, установленном внутренними
          документами банка.

  - type: camera_obstructed
    title: "Камера видеонаблюдения перекрыта"
    kind: camera_obstructed
    min_duration_sec: 2
    dark_ratio: 0.3
    blur_ratio: 0.1
    severity: high
    observed: "изображение с камеры резко потемнело или потеряло резкость ({duration} с)"
    why: >-
      Камера закрыта, отвёрнута или засвечена: операции в этот период не
      видны, хотя касса должна быть под видеонаблюдением.
    norms:
      - ref: rules_14
        clause: "п. 16, пп. 6) (в редакции на период приостановления до 01.01.2027)"
        quote: "касса оборудуется видеокамерами системы видеонаблюдения"

  - type: cash_zone_door_open
    title: "Дверь кассы открыта"
    kind: object_in_zone
    classes: ["door_open"]
    zone: cash_zone
    min_conf: 0.5
    min_duration_sec: 10
    severity: medium
    observed: "дверь кассы остаётся открытой ({duration} с)"
    why: "Касса должна иметь вход с закрывающейся на замок дверью."
    norms:
      - ref: rules_14
        clause: "п. 8"
        quote: >-
          Кассовый узел подлежит изолированию от других производственных,
          подсобных, подвальных и служебных помещений одним закрывающимся
          служебным входом.
      - ref: rules_14
        clause: "п. 16, пп. 1) (в редакции на период приостановления до 01.01.2027)"
        quote: "каждая касса имеет отдельный вход с закрывающейся на замок дверью"

learned_types:
  workplace_left_open:
    observed: "кассир уходит с рабочего места, а рабочее место остаётся открытым: включён компьютер, не убраны ценности ({duration} с)"
  cashier_uses_phone:
    observed: "кассир держит в руках телефон ({duration} с)"
  second_visitor_during_service:
    observed: "во время обслуживания к столу подходит ещё один человек ({duration} с)"
  personal_items_in_cash_zone:
    observed: "на рабочем месте кассира личные вещи, еда или напитки ({duration} с)"

  cash_left_open:
    title: "Наличные или сумка оставлены открыто"
    severity: high
    observed: "на столе остаются наличные или сумка с ценностями, их не убирают в сейф ({duration} с)"
    why: >-
      Ранее принятые наличные должны храниться в закрывающихся на ключ
      устройствах рабочего места. Открыто лежащие деньги или сумка, особенно
      когда кассир отходит или подходит следующий клиент, — повод проверить
      момент.
    norms:
      - ref: rules_231
        clause: "п. 20"
        quote: >-
          На рабочем месте кассового работника находятся наличные деньги
          клиента. Все ранее принятые наличные деньги хранятся в специальных
          устройствах, находящихся на рабочем месте кассового работника,
          закрывающихся на ключ, предназначенных для хранения наличных денег
          (металлический шкаф, сейф, тележка, ящики стола, тумба).

  safe_left_open:
    title: "Сейф оставлен открытым"
    severity: high
    observed: "дверца сейфа остаётся открытой, кассир занимается другим ({duration} с)"
    why: >-
      Наличные хранятся в закрывающихся на ключ устройствах. Открытый сейф без
      присмотра делает это требование бессмысленным.
    norms:
      - ref: rules_231
        clause: "п. 20"
        quote: >-
          Все ранее принятые наличные деньги хранятся в специальных устройствах,
          находящихся на рабочем месте кассового работника, закрывающихся на
          ключ, предназначенных для хранения наличных денег (металлический шкаф,
          сейф, тележка, ящики стола, тумба).

  cash_counting_hidden:
    title: "Пересчёт денег вне поля зрения клиента"
    severity: high
    observed: "кассир пересчитывает купюры руками так, что клиенту их не видно ({duration} с)"
    why: >-
      Деньги принимаются, пересчитываются и выдаются в присутствии клиента.
      Пересчёт, скрытый от клиента, нужно посмотреть на видео целиком.
    norms:
      - ref: rules_231
        clause: "п. 20"
        quote: >-
          Наличные деньги принимаются и пересчитываются кассовым работником в
          присутствии клиента.
      - ref: rules_231
        clause: "п. 31, пп. 4)"
        quote: >-
          пересчитывает подготовленные к выдаче наличные деньги в присутствии
          клиента, выдает клиенту наличные деньги

  cash_counted_without_control:
    title: "Пересчёт наличных без контролирующего работника"
    severity: medium
    observed: "кассир пересчитывает наличные одна, клиента и второго работника рядом нет ({duration} с)"
    why: >-
      Пересчёт, сортировка и упаковка наличных вне обслуживания клиента
      ведутся в присутствии контролирующего работника. Второго работника в
      кадре нет; возможно, он вне поля зрения камеры.
    norms:
      - ref: rules_231
        clause: "п. 42"
        quote: >-
          Кассовые операции по пересчету, сортировке и упаковке наличных денег
          осуществляются кассовым работником в присутствии контролирующего
          работника, за исключением случаев совершения кассовых операций по
          приему и выдаче наличных денег клиенту.

  cash_to_pocket:
    title: "Наличные убраны в карман или к личным вещам"
    severity: high
    observed: "кассир берёт купюры со стола и подносит их к карману или одежде ({duration} с)"
    why: >-
      Личные деньги работников хранятся вне кассового узла, смешивать их с
      наличными банка нельзя. Куда именно ушли купюры, видно только по
      полному фрагменту.
    norms:
      - ref: rules_231
        clause: "п. 12"
        quote: >-
          Хранение личных вещей, наличных денег и ценностей работников банка
          осуществляется вне кассового узла в порядке, установленном внутренними
          документами банка.

  collection_bag_procedure:
    title: "Приём инкассаторской сумки без проверки"
    severity: high
    observed: "инкассатор передаёт сумку и уходит, проверки сумки при нём не видно ({duration} с)"
    why: >-
      Принимая сумку, кассир проверяет её целостность и пломбирование, а при
      нарушении целостности вскрывает и пересчитывает её при инкассаторе.
    norms:
      - ref: rules_231
        clause: "п. 24, пп. 3)–4)"
        quote: "3) проверяет целостность сумки; 4) проверяет правильность пломбирования сумки"
      - ref: rules_231
        clause: "п. 25"
        quote: >-
          В случае обнаружения нарушения целостности сумки кассовый работник в
          присутствии работника подразделения инкассации банка или
          инкассаторской организации вскрывает и пересчитывает находящиеся в
          них наличные деньги и ценности.

  outsider_entered:
    title: "Постороннее лицо в помещении кассы"
    severity: high
    observed: "в помещение кассы входит человек, пока там работают с ценностями ({duration} с)"
    why: >-
      Кассовый узел изолирован и имеет один закрывающийся вход. Кто вошёл и
      был ли у него допуск, по видео не определить — это решает проверяющий.
    norms:
      - ref: rules_14
        clause: "п. 8"
        quote: >-
          Кассовый узел подлежит изолированию от других производственных,
          подсобных, подвальных и служебных помещений одним закрывающимся
          служебным входом.

  cash_door_left_open:
    title: "Дверь кассы оставлена открытой"
    severity: medium
    observed: "дверь помещения кассы остаётся открытой во время работы ({duration} с)"
    why: "Касса должна иметь вход с закрывающейся на замок дверью."
    norms:
      - ref: rules_14
        clause: "п. 8"
        quote: >-
          Кассовый узел подлежит изолированию от других производственных,
          подсобных, подвальных и служебных помещений одним закрывающимся
          служебным входом.
      - ref: rules_14
        clause: "п. 16, пп. 1) (в редакции на период приостановления до 01.01.2027)"
        quote: "каждая касса имеет отдельный вход с закрывающейся на замок дверью"

  client_left_before_count:
    title: "Клиент ушёл, не дождавшись пересчёта"
    severity: medium
    observed: "клиент уходит от кассы, пока деньги ещё пересчитываются ({duration} с)"
    why: >-
      Клиент пересчитывает полученные деньги, не отходя от кассы. Если клиент
      ушёл раньше, расхождение потом не доказать.
    norms:
      - ref: rules_231
        clause: "п. 35"
        quote: >-
          Клиент пересчитывает полученные наличные деньги, не отходя от кассы,
          или в помещении для пересчета наличных денег клиентами в присутствии
          кассового работника или контролирующего работника.
