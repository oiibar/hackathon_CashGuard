# Маппинг "что увидела YOLO" -> "какое нарушение и какая норма РК".
# Чтобы добавить нарушение под новый класс кастомной модели (например,
# cash_handover), добавьте сюда правило. Код менять не нужно.
#
# Тексты норм сверены с редакцией актов на 2026 год. Перед защитой
# откройте ссылки adilet.zan.kz и убедитесь, что пункты не изменились.

norms:
  rules_231:
    act: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот,
      монет и ценностей в банках второго уровня, филиалах банков-нерезидентов
      Республики Казахстан, Национальном операторе почты и юридических лицах,
      исключительной деятельностью которых является инкассация банкнот, монет и
      ценностей (утв. постановлением Правления Национального Банка Республики
      Казахстан от 29 ноября 2019 года № 231)
    short: "Правила кассовых операций (пост. Правления НБРК от 29.11.2019 № 231)"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
  rules_14:
    act: >-
      Правила организации охраны и устройства помещений банков второго уровня,
      филиалов банков-нерезидентов Республики Казахстан, Национального оператора
      почты, юридических лиц, исключительной деятельностью которых является
      инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих
      деятельность исключительно через обменные пункты (утв. постановлением
      Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14)
    short: "Правила охраны и устройства помещений (пост. Правления НБРК от 24.02.2020 № 14)"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"

rules:
  # ---------- работают сразу на стоковой yolov8n.pt (COCO) ----------

  - type: mobile_phone_in_cash_zone
    title: "Мобильный телефон в кассовой зоне"
    kind: object_in_zone
    classes: ["cell phone"]
    zone: cash_zone
    min_conf: 0.4
    min_duration_sec: 2
    severity: high
    description: >-
      В кассовой зоне зафиксирован мобильный телефон. Смартфон имеет функцию
      фото- и видеофиксации, такие средства связи вносить в кассовый узел нельзя.
    norms:
      - ref: rules_231
        clause: "п. 12"
        summary: >-
          личные вещи работников хранятся вне кассового узла; вносить в кассовый
          узел допускается только средства связи без функции фото- и видеофиксации

  - type: personal_items_in_cash_zone
    title: "Личные вещи в кассовой зоне"
    kind: object_in_zone
    classes: ["handbag", "backpack", "suitcase"]
    zone: cash_zone
    min_conf: 0.4
    min_duration_sec: 5
    severity: medium
    description: >-
      В кассовой зоне зафиксированы личные вещи (сумка, рюкзак или чемодан).
    norms:
      - ref: rules_231
        clause: "п. 12"
        summary: "хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла"

  - type: unauthorized_person_in_cash_zone
    title: "Постороннее лицо в кассовой зоне"
    kind: person_count_exceeds
    zone: cash_zone
    max_count: 2          # кассир + контролирующий работник (п. 42 Правил № 231)
    min_conf: 0.45
    min_duration_sec: 3
    severity: high
    description: >-
      В кассовой зоне одновременно находится больше людей, чем допускается для
      рабочего места (кассир и контролирующий работник). Вероятно присутствие
      постороннего лица. Личность не определяется: распознавание лиц не используется.
    norms:
      - ref: rules_14
        clause: "п. 8"
        summary: "кассовый узел изолирован и имеет один закрывающийся служебный вход"
      - ref: rules_231
        clause: "п. 75"
        summary: >-
          вход в кладовую и сейфовую комнату разрешён лицам, ответственным за
          сохранность наличных денег; иным лицам — по распорядительному документу
          и только в сопровождении ответственных лиц

  - type: cashier_left_during_service
    title: "Кассир покинул рабочее место во время обслуживания"
    kind: zone_unattended
    watch_classes: ["person"]     # клиент у окна
    watch_zone: client_zone
    staff_zone: cash_zone         # в зоне кассира никого
    min_conf: 0.5
    min_duration_sec: 10
    severity: high
    description: >-
      Клиент находится у кассы, а на рабочем месте кассира никого нет.
    norms:
      - ref: rules_231
        clause: "п. 22"
        summary: "кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента"

  - type: camera_obstructed
    title: "Камера видеонаблюдения перекрыта"
    kind: camera_obstructed
    min_duration_sec: 3
    dark_ratio: 0.3     # кадр темнее 30% от обычной яркости этого видео
    blur_ratio: 0.1     # резкость ниже 10% от обычной
    severity: high
    description: >-
      Изображение с камеры резко потемнело или потеряло резкость (камера закрыта,
      отвёрнута или засвечена). Операции в этот период не просматриваются.
    norms:
      - ref: rules_14
        clause: "п. 16, пп. 6"
        summary: "касса оборудуется видеокамерами системы видеонаблюдения"

  # ---------- нужна кастомная модель (ml/train.py) ----------
  # Пока ни одна загруженная модель не знает этих классов, правила
  # автоматически пропускаются (см. meta.skipped_rules в ответе).

  - type: cash_left_unattended
    title: "Наличные оставлены без присмотра"
    kind: zone_unattended
    watch_classes: ["cash", "cash_drawer_open"]
    watch_zone: cash_zone
    staff_zone: cash_zone
    min_conf: 0.45
    min_duration_sec: 5
    severity: high
    description: >-
      На рабочем месте кассира открыто лежат наличные или открыт денежный ящик,
      при этом кассира на месте нет.
    norms:
      - ref: rules_231
        clause: "п. 20"
        summary: >-
          все ранее принятые наличные хранятся на рабочем месте в специальных
          устройствах, закрывающихся на ключ (шкаф, сейф, тележка, ящики стола)
      - ref: rules_231
        clause: "п. 22"
        summary: "кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента"

  - type: cash_zone_door_open
    title: "Дверь кассового узла открыта"
    kind: object_in_zone
    classes: ["door_open"]
    zone: cash_zone
    min_conf: 0.5
    min_duration_sec: 10
    severity: medium
    description: >-
      Дверь кассового узла (кассы) остаётся открытой дольше допустимого.
    norms:
      - ref: rules_14
        clause: "п. 8"
        summary: "кассовый узел изолирован и имеет один закрывающийся служебный вход"
